# Source ACL, ConnectPort and destination filtering are three separate controls (plan section 8).
# Listen only on the client-facing interface: the issuer and gateway networks cannot use the proxy.
Listen 172.28.10.2
Port 8888
Timeout 30
MaxClients 64
PidFile "/tmp/tinyproxy.pid"
Syslog Off
LogLevel Critical
DisableViaHeader Yes

# 1. Only the five client addresses' subnet may use the proxy.
Allow 172.28.10.0/24

# 2. CONNECT is limited to port 443.
ConnectPort 443

# 3. Destination filter over the full "host:port" string, default deny. Plain-HTTP proxying (GET http://...)
#    never matches an anchored host:443 pattern, so only the two TLS tunnels are possible. Raw IPs, other ports
#    and lookalike names do not match.
Filter "/etc/tinyproxy/filter"
FilterURLs On
FilterExtended On
FilterDefaultDeny Yes
