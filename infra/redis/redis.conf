# Replay Store. Single primary, memory only. Bound to the gateway_replay address; the gateway user and its ACL are
# created by the controller at run start. Only the controller account below exists until then.
bind 172.28.40.10
port 6379
protected-mode yes
daemonize no
maxclients 64

# Local admin path for the controller (docker exec into this container); owner-only inside a private tmpfs.
unixsocket /run/redis/redis.sock
unixsocketperm 700

# No persistence: nothing survives a restart, which the lifecycle treats as a closed run.
save ""
appendonly no
dir /tmp

# Diagnostic retention off (plan section 7): no slow log, no ACL log, no latency history, no keyspace events.
slowlog-log-slower-than -1
slowlog-max-len 0
acllog-max-len 0
latency-monitor-threshold 0
latency-tracking no
notify-keyspace-events ""
loglevel warning
logfile ""

# No anonymous access. Accounts come from the mounted secret (controller) and later from the controller (gateway).
user default off
include /run/secrets/redis-acl.conf
