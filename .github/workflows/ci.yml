name: Bootstrap checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 resolved 2026-10-24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 resolved 2026-10-24
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --prefix src/services/gateway
      - run: npm ci --ignore-scripts --prefix src/services/lab
      - run: npm run check:g0
      - run: npm run test:replay --prefix src/services/gateway
      - run: npm run test:regional-replay --prefix src/services/gateway
      - run: npm run test:regional-integration --prefix src/services/gateway
      - name: Detect regional service implementation
        id: regional
        shell: bash
        run: |
          if test -f src/services/arc/src/service.rs; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ARC service is absent on this branch; native consumer acceptance awaits integration."
          fi
      - name: Verify actual regional consumers without skipped tests
        if: steps.regional.outputs.available == 'true'
        run: node scripts/check-regional-consumers.mjs
      - run: npm run test:redis-adapter --prefix src/services/gateway
      - run: npm run test:recovery --prefix src/services/gateway
      - run: node scripts/check-secrets.mjs
      - run: python3 scripts/derive-golden-fixture.py --check
      - run: python3 scripts/derive-regional-fixture.py --check
      - run: npm audit --prefix src/services/gateway
      - run: npm audit --prefix src/services/lab
      - run: docker build -f src/services/gateway/Dockerfile -t tokenforge-g0:ci .
      - run: node scripts/check-g0-image.mjs tokenforge-g0:ci
      - run: docker build -f src/services/lab/Dockerfile -t tokenforge-lab-g0:ci .
      - run: node src/services/lab/scripts/check-image.mjs tokenforge-lab-g0:ci
  deployed-demo:
    # The complete system: real issuer, CONNECT proxy, two-worker gateway, Redis and private origin on the planned networks.
    needs: contracts-and-crypto
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 resolved 2026-10-24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 resolved 2026-10-24
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --prefix src/services/gateway
      - run: npm ci --ignore-scripts --prefix src/services/lab
      - run: node infra/scripts/provision-secrets.ts
      - run: node src/services/lab/src/controller/cli.ts preflight
      - run: node infra/scripts/check-network.mjs
      - run: node src/services/lab/src/controller/cli.ts run --suite demo --out artifacts/demo-report.json
      - run: node src/services/lab/src/controller/cli.ts verify-report --file artifacts/demo-report.json --require-pass
      - run: node src/services/lab/src/controller/cli.ts run --suite security --out artifacts/security-report.json
      - run: node src/services/lab/src/controller/cli.ts verify-report --file artifacts/security-report.json --require-pass
      - run: node src/services/lab/src/controller/cli.ts run --suite performance-smoke --out artifacts/benchmark-smoke.json
      - run: node src/services/lab/src/controller/cli.ts verify-report --file artifacts/benchmark-smoke.json
      - run: node src/services/lab/src/controller/cli.ts summarize-benchmark --file artifacts/benchmark-smoke.json
      - if: always()
        run: node scripts/collect-safe-reports.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-11-13
        with:
          name: sanitized-deployed-reports
          path: sanitized-reports/*.json
          if-no-files-found: ignore
          retention-days: 14

